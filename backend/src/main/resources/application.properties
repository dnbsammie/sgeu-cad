spring.application.name=sgeu-cad-backend

server.port=8080

# Database (provided by Podman compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/sgeu_cad
spring.datasource.username=sgeu
spring.datasource.password=sgeu

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Better error responses from our controller advice (no stacktraces to clients)
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
